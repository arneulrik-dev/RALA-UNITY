<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#071426" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RALA NORDIC" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>RALA NORDIC</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand nordic"><span>RALA</span><strong>NORDIC</strong></div>
      <p>Velg tjeneste</p>
    </header>
    <section class="apps" aria-label="RALA apper">
      <article class="app-card">
        <div class="icon"><span>RALA</span><strong>GO</strong></div>
        <div class="copy"><h2>RALA GO</h2><p>Bestilling og innkjøp gjort enkelt.</p></div>
        <button class="open" data-app="go">ÅPNE</button>
      </article>
      <article class="app-card" id="safe-card">
        <div class="icon"><span>RALA</span><strong>SAFE</strong></div>
        <div class="copy"><h2>RALA SAFE</h2><p>Sikkerhet og kontroll samlet på ett sted.</p></div>
        <button class="open" id="safe-button" data-app="safe">ÅPNE</button>
      </article>
    </section>
    <button id="install-button" class="install" hidden>INSTALLER RALA NORDIC</button>
    <p id="ios-install" class="install-help" hidden>På iPhone: trykk Del → Legg til på Hjem-skjermen.</p>
    <footer>RALA NORDIC</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
